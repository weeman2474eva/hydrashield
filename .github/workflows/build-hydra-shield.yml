name: Build HYDRA SHIELD APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out HYDRA SHIELD
        uses: actions/checkout@v5

      - name: Check out stable OpenVPN engine
        run: |
          git clone https://github.com/schwabe/ics-openvpn.git app
          cd app
          git checkout 73ce3c99dde39207990d66c21be8201228cd1f09
          git submodule update --init --recursive

      - name: Apply HYDRA SHIELD interface
        run: unzip -o hydra-overlay.zip -x main/build.gradle.kts -d app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/**/*.gradle*

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install stable Android platform and NDK
        run: sdkmanager "platforms;android-36" "ndk;29.0.14206865"

      - name: Build universal debug APK
        working-directory: app
        run: ./gradlew :main:assembleSkeletonOvpn23Debug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p release
          find app/main/build/outputs/apk -name '*universal*.apk' -exec cp {} release/HYDRA-SHIELD.apk \;
          if [ ! -f release/HYDRA-SHIELD.apk ]; then
            find app/main/build/outputs/apk -name '*.apk' -print -quit -exec cp {} release/HYDRA-SHIELD.apk \;
          fi
          test -f release/HYDRA-SHIELD.apk

      - name: Upload HYDRA SHIELD APK
        uses: actions/upload-artifact@v4
        with:
          name: HYDRA-SHIELD-APK
          path: release/HYDRA-SHIELD.apk
          if-no-files-found: error
          retention-days: 30
